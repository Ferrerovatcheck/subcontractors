<title>Carrier VAT Checker</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {

    background: #f0f2f5;
    color: #1a1a1a;
    min-height: 100vh;
    display: flex;
    align-items: flex-start;
    justify-content: center;
    padding: 2.5rem 1rem;
  }

  .container { width: 100%; max-width: 600px; }

  /* ── Language selector ── */

    display: flex;
    justify-content: flex-end;
    gap: 6px;
    margin-bottom: 1.25rem;
  }

  .lang-btn {
    background: #fff;
    border: 1.5px solid #e0e0e0;
    border-radius: 8px;
    padding: 5px 10px;
    font-size: 18px;
    cursor: pointer;
    line-height: 1;
    transition: border-color 0.15s, box-shadow 0.15s;
  }

  .lang-btn:hover  { border-color: #0078d4; }
  .lang-btn.active { border-color: #0078d4; box-shadow: 0 0 0 3px rgba(0,120,212,0.15); }

  .header {
    display: flex;
    align-items: center;
    gap: 14px;
    margin-bottom: 1.75rem;
  }
  .notice-banner {
    display: flex;
    align-items: flex-start;
    gap: 10px;
    background: #fff8e1;
    border: 1px solid #ffe28a;
    color: #7b5800;
    border-radius: 10px;
    padding: 12px 16px;
    margin-bottom: 1.25rem;
    font-size: 13px;
    line-height: 1.5;
  }
.refresh-tip {
    font-size: 12px;
    color: #888;
    text-align: center;
    background: #f5f5f5;
    border-radius: 8px;
    padding: 10px 14px;
    margin-top: 1.5rem;
    line-height: 1.5;
  }
  .notice-icon {
    font-size: 16px;
    flex-shrink: 0;
  }
  }

  .notice-icon {
    font-size: 16px;
    flex-shrink: 0;
  }
 
  .header-icon {
    width: 60px; height: 60px;
    background: #0078d4;
    border-radius: 12px;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
  }

  .header-icon svg {
    width: 34px; height: 34px;
    fill: none; stroke: #fff;
    stroke-width: 2; stroke-linecap: round; stroke-linejoin: round;
  }

  .header-text h1   { font-size: 20px; font-weight: 700; color: #1a1a1a; }
  .header-text p    { font-size: 13px; color: #666; margin-top: 3px; }
  .header-text .warning { font-size: 12px; color: #1a1a1a; margin-top: 4px; font-weight: 600; }

  .card {
    background: #fff;
    border: 1px solid #e0e0e0;
    border-radius: 12px;
    padding: 1.5rem;
    margin-bottom: 1rem;
  }

  .section-label {
    font-size: 11px;
    font-weight: 700;
    color: #888;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    margin-bottom: 8px;
  }

  .input-row { display: flex; gap: 10px; }

  input[type="text"] {
    flex: 1;
    font-size: 15px;
    padding: 10px 14px;
    border: 1px solid #ccc;
    border-radius: 8px;
    background: #fafafa;
    color: #1a1a1a;
    outline: none;
    transition: border-color 0.15s, box-shadow 0.15s;
  }

  input[type="text"]:focus {
    border-color: #0078d4;
    box-shadow: 0 0 0 3px rgba(0,120,212,0.12);
    background: #fff;
  }

  input[type="text"]:disabled {
    background: #f5f5f5;
    color: #aaa;
    cursor: not-allowed;
    border-color: #e0e0e0;
  }

  input[type="text"]::placeholder { color: #bbb; }

  .btn {
    padding: 10px 20px;
    border: none;
    border-radius: 8px;
    font-family: 'Segoe UI', Arial, sans-serif;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.15s, opacity 0.15s;
    white-space: nowrap;
  }

  .btn-primary { background: #0078d4; color: #fff; }
  .btn-primary:hover:not(:disabled) { background: #006bbf; }
  .btn-primary:disabled { background: #ccc; cursor: not-allowed; }
  .btn:active:not(:disabled) { transform: scale(0.98); }

  .hint { font-size: 12px; color: #999; margin-top: 7px; }
  .hint a { color: #0078d4; }

  .feedback {
    font-size: 13px;
    margin-top: 10px;
    padding: 9px 13px;
    border-radius: 7px;
    display: none;
  }

  .feedback.visible { display: block; }
  .feedback.error   { background: #fdecea; color: #b71c1c; }
  .feedback.success { background: #e6f4ea; color: #1e7e34; }
  .feedback.loading { background: #e3f2fd; color: #0d47a1; }

  .divider { border: none; border-top: 1px solid #f0f0f0; margin: 1.25rem 0; }

  .vat-section { display: none; }
  .vat-section.visible { display: block; }

  .result-card { display: none; }
  .result-card.visible { display: block; }

  .result-header {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 12px;
    margin-bottom: 14px;
  }

  .carrier-name { font-size: 18px; font-weight: 700; color: #1a1a1a; line-height: 1.3; }
  .vat-display  { font-family: 'Courier New', monospace; font-size: 12px; color: #999; margin-top: 4px; }

  .pill {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 5px 13px;
    border-radius: 99px;
    font-size: 12px;
    font-weight: 700;
    white-space: nowrap;
    flex-shrink: 0;
  }

  .dot { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; }

  .s-approved              { background: #e6f4ea; color: #1e7e34; }
  .s-approved              .dot { background: #28a745; }
  .s-suspended             { background: #fdecea; color: #b71c1c; }
  .s-suspended             .dot { background: #000; }
  .s-pending-documentation { background: #fff8e1; color: #7b5800; }
  .s-pending-documentation .dot { background: #ffc107; }
  .s-not-found             { background: #f5f5f5; color: #555; }
  .s-not-found             .dot { background: #aaa; }
  .s-error                 { background: #fdecea; color: #b71c1c; }
  .s-error                 .dot { background: #e53935; }

  .result-msg { font-size: 14px; color: #444; line-height: 1.65; }
  .result-msg strong { color: #1a1a1a; font-weight: 600; }

  .action-link {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    margin-top: 12px;
    padding: 7px 14px;
    font-size: 13px;
    font-weight: 600;
    color: #0078d4;
    border: 1px solid #0078d4;
    border-radius: 7px;
    text-decoration: none;
    transition: background 0.1s;
  }

  .action-link:hover { background: #e3f2fd; }

  .new-search-btn {
    margin-top: 14px;
    background: none;
    border: 1px solid #ddd;
    color: #555;
    font-size: 13px;
    padding: 7px 16px;
    border-radius: 7px;
    cursor: pointer;
    font-family: 'Segoe UI', Arial, sans-serif;
    transition: background 0.1s;
    display: block;
  }

  .new-search-btn:hover { background: #f5f5f5; }

  .footer {
    font-size: 11px;
    color: #bbb;
    text-align: center;
    margin-top: 1.5rem;
    line-height: 1.8;
  }

  .footer a { color: #0078d4; text-decoration: none; }

  .spinner {
    display: inline-block;
    width: 13px; height: 13px;
    border: 2px solid rgba(13,71,161,0.3);
    border-top-color: #0d47a1;
    border-radius: 50%;
    animation: spin 0.7s linear infinite;
    vertical-align: middle;
    margin-right: 6px;
  }

  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>

    <div class="result-card" id="resultCard">

        </div>
      </div>
      <div class="result-msg" id="rMsg"></div>
      <div id="rAction"></div>
      <button class="new-search-btn" id="ui-newsearch" onclick="newSearch()"></button>
    </div>
  </div>

 <div class="refresh-tip" id="ui-refreshtip"></div>

        suspended:               { msg: "Ten przewoźnik jest obecnie <strong>zawieszony</strong> i <strong>NIE JEST UPOWAŻNIONY</strong> do transportu naszych produktów." },

  };

  // ================================================================
  // STATUS LABELS — always in English for log consistency
  // ================================================================
  const STATUS_LABELS = {
    approved:                "Approved",
    suspended:               "Suspended",
    "pending documentation": "Not Approved - Pending",
    "not-found":             "Not found",
    error:                   "ERROR"
  };

  // ================================================================
  // TOOL LOGIC — no need to edit below this line
  // ================================================================
  let validatedCode = null;
  let currentLang   = 'en';

  function tx() { return TRANSLATIONS[currentLang]; }

  function setLang(lang) {
    currentLang = lang;
    localStorage.setItem('vatCheckerLang', lang);

    document.querySelectorAll('.lang-btn').forEach(b => b.classList.remove('active'));
    document.getElementById('lang-' + lang).classList.add('active');

    const t = tx();
    document.getElementById('ui-title').textContent      = t.title;
    document.getElementById('ui-subtitle').textContent   = t.subtitle;
    document.getElementById('ui-warning1').textContent   = t.warning1;
    document.getElementById('ui-warning2').textContent   = t.warning2;
    document.getElementById('ui-step1label').textContent = t.step1label;
    document.getElementById('codeInput').placeholder     = t.codePlaceholder;
    document.getElementById('ui-codehint').innerHTML     = t.codeHint;
    document.getElementById('ui-step2label').textContent = t.step2label;
    document.getElementById('vatInput').placeholder      = t.vatPlaceholder;
    document.getElementById('ui-vathint').innerHTML      = t.vatHint;
    document.getElementById('ui-newsearch').textContent  = t.newSearch;
    document.getElementById('ui-footer').innerHTML       = t.footer;
   document.getElementById('ui-refreshtip').textContent = t.refreshTip;
   <!-- document.getElementById('ui-noticebanner').textContent = t.noticeBanner;
   -->
    

    document.getElementById('codeBtn').textContent = validatedCode ? t.verifiedBtn : t.verifyBtn;
    document.getElementById('vatBtn').textContent  = t.checkBtn;
  }

  function normalise(str) { return (str || "").trim().toLowerCase(); }

  function getStatusConfig(rawStatus, carrierFound) {
    const t = tx();
    if (!carrierFound) {
      return { cls: "s-not-found", label: STATUS_LABELS["not-found"], msg: t.statuses["not-found"].msg };
    }
    const key = normalise(rawStatus);
    for (const [k, v] of Object.entries(t.statuses)) {
      if (k !== "not-found" && k !== "error" && normalise(k) === key) {
        const cssKey = k === "pending documentation" ? "pending-documentation" : k;
        return { cls: "s-" + cssKey, label: STATUS_LABELS[k] || rawStatus, msg: v.msg };
      }
    }
    return { cls: "s-error", label: STATUS_LABELS["error"], msg: t.statuses["error"].msg };
  }

  async function validateCode() {
    const code = document.getElementById('codeInput').value.trim();
    if (!code) return;
    const btn = document.getElementById('codeBtn');
    const fb  = document.getElementById('codeFeedback');
    btn.disabled = true;
    showFb(fb, 'loading', `<span class="spinner"></span>${tx().verifying}`);
    try {
      const res  = await fetch(`${SCRIPT_URL}?action=validateCode&code=${encodeURIComponent(code)}`);
      const data = await res.json();
      if (data.success) {
  validatedCode = code;
  showFb(fb, 'success', tx().codeAccepted);
  document.getElementById('codeInput').disabled = true;
  btn.disabled    = true;
  btn.textContent = tx().verifiedBtn;
  document.getElementById('vatSection').classList.add('visible');
  document.getElementById('vatInput').focus();
} else if (data.deactivated) {
  showFb(fb, 'error', tx().codeDeactivated);
  btn.disabled = false;
} else {
  showFb(fb, 'error', tx().codeError);
  btn.disabled = false;
}
    } catch (e) {
      showFb(fb, 'error', tx().connError);
      btn.disabled = false;
    }
  }

  async function lookupVAT() {
    const vat = document.getElementById('vatInput').value.trim();
    if (!vat || !validatedCode) return;
    const btn = document.getElementById('vatBtn');
    const fb  = document.getElementById('vatFeedback');
    btn.disabled = true;
    document.getElementById('resultCard').classList.remove('visible');
    showFb(fb, 'loading', `<span class="spinner"></span>${tx().lookingUp}`);
    try {
      const res  = await fetch(`${SCRIPT_URL}?action=lookupVAT&vat=${encodeURIComponent(vat)}&code=${encodeURIComponent(validatedCode)}`);
      const data = await res.json();
      if (data.success) {
        hideFb(fb);
        showResult(vat, data.carrierName, data.status);
      } else {
        showFb(fb, 'error', tx().lookupFailed);
      }
    } catch (e) {
      showFb(fb, 'error', tx().connError);
    }
    btn.disabled = false;
  }

  function showResult(vat, carrierName, rawStatus) {
    const carrierFound = !!carrierName;
    const cfg          = getStatusConfig(rawStatus, carrierFound);
    document.getElementById('rName').textContent     = carrierFound ? carrierName : tx().notRegistered;
    document.getElementById('rVat').textContent      = vat.toUpperCase();
    const pill = document.getElementById('rPill');
    pill.className = 'pill ' + cfg.cls;
    document.getElementById('rPillText').textContent = cfg.label;
    document.getElementById('rMsg').innerHTML        = cfg.msg;
    document.getElementById('rAction').innerHTML     = !carrierFound
      ? `<a class="action-link" href="${NEW_CARRIER_URL}">${tx().registerLink}</a>` : '';
    document.getElementById('resultCard').classList.add('visible');
  }

  function newSearch() {
    document.getElementById('vatInput').value = '';
    document.getElementById('resultCard').classList.remove('visible');
    hideFb(document.getElementById('vatFeedback'));
    document.getElementById('vatInput').focus();
  }

  function showFb(el, type, html) { el.className = `feedback ${type} visible`; el.innerHTML = html; }
  function hideFb(el)             { el.className = 'feedback'; el.innerHTML = ''; }

  document.addEventListener('keydown', e => {
    if (e.key !== 'Enter') return;
    if (!validatedCode) validateCode(); else lookupVAT();
  });

  // Initialise — restore saved language or default to English
  const savedLang = localStorage.getItem('vatCheckerLang');
  setLang(savedLang && TRANSLATIONS[savedLang] ? savedLang : 'en');
</script>
